name: Build Plugins

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      # 1. Клонирование репозитория с сабмодулями
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Настройка MSBuild для Windows
      - name: Set up MSBuild (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      # 2.1 Официальная установка WebView2 для JUCE
      - name: Install WebView2 SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # 1. Установка через официальный провайдер PowerShell (куда смотрит FindWebView2.cmake)
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -Source nugetRepository -Force

          # 2. Дублирующая установка локально и подготовка пути для CMake (с прямыми слэшами '/')
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          $pkgPath = (Get-ChildItem -Directory -Path packages -Filter "Microsoft.Web.WebView2*").FullName.Replace('\', '/')
          echo "JUCE_WEBVIEW2_DIR=$pkgPath" >> $env:GITHUB_ENV

      # 3. Конфигурация CMake
      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.JUCE_WEBVIEW2_DIR }}"

      # 4. Сборка плагинов
      - name: Build
        run: cmake --build build --config Release --parallel 4

      # 5. Упаковка артефактов macOS (VST3, AU, App)
      - name: Package macOS Artifacts
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist/mac
          find build -name "*.vst3" -type d -maxdepth 4 -exec cp -R {} dist/mac/ \;
          find build -name "*.component" -type d -maxdepth 4 -exec cp -R {} dist/mac/ \;
          find build -name "*.app" -type d -maxdepth 4 -exec cp -R {} dist/mac/ \;
          cd dist
          zip -r ../dom-radio-mac.zip mac

      # 6. Загрузка архива macOS
      - name: Upload macOS Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dom-radio-mac
          path: dom-radio-mac.zip

      # 7. Упаковка артефактов Windows (VST3 и .exe)
      - name: Package Windows Artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/win
          Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Where-Object { $_.FullName -notmatch "_artefacts" -or $_.Parent.Name -eq "VST3" } | ForEach-Object { Copy-Item -Path $_.FullName -Destination dist/win -Recurse -Force }
          Get-ChildItem -Path build -Recurse -File -Filter "*.exe" | Where-Object { $_.FullName -match "Standalone" -or $_.Name -notmatch "vstest" } | ForEach-Object { Copy-Item -Path $_.FullName -Destination dist/win -Force }
          Compress-Archive -Path dist/win -DestinationPath dom-radio-win.zip

      # 8. Загрузка архива Windows
      - name: Upload Windows Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dom-radio-win
          path: dom-radio-win.zip
