<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troakar Spectral - Surgical Spectral Dynamics</title>

    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">

    <link rel="stylesheet" href="css/components/decorations.css">
    <link rel="stylesheet" href="css/components/dymo-label.css">
    <link rel="stylesheet" href="css/components/backlit-button.css">
    <link rel="stylesheet" href="css/components/chicken-knob.css">
    <link rel="stylesheet" href="css/components/crt-screen.css">
    <link rel="stylesheet" href="css/components/jack-socket.css">
    <link rel="stylesheet" href="css/components/gradient-overlay.css">
</head>
<body>

    <div class="device-chassis">
        <div class="chassis-texture"></div>
        <div class="chassis-highlight"></div>

        <header class="panel top-panel">
            <div class="brand">
                <h1>TROAKAR SPECTRAL</h1>
                <span class="subtitle">SURGICAL SPECTRAL DYNAMICS</span>
            </div>

            <!-- Gradient zone badges (G1-G4) -->
            <div id="gradient-overlay" class="gradient-overlay-container"></div>

            <div class="top-controls">
                <select id="fft-combo" class="combo-box">
                    <option>512 (Fast)</option>
                    <option selected>1024 (Balanced)</option>
                    <option>2048 (Precise)</option>
                </select>
                <select id="view-range-combo" class="combo-box">
                    <option>24dB</option>
                    <option>48dB</option>
                    <option selected>72dB</option>
                    <option>96dB</option>
                    <option>120dB</option>
                </select>
                <button id="btn-delta" class="backlit-button red">DELTA</button>
            </div>
        </header>

        <div class="main-workspace">
            <aside class="panel left-panel">

                <div class="knob-group" style="margin-top: 12px;">
                    <div id="knob-in" class="chicken-knob medium"></div>
                    <span class="dymo-label">IN GAIN</span>
                    <span class="knob-value-display" id="knob-in-value">0.0 dB</span>
                </div>

                <div class="link-button-wrapper">
                    <button id="btn-link" class="backlit-button cyan small">LINK</button>
                </div>

                <div class="knob-group">
                    <div id="knob-out" class="chicken-knob medium"></div>
                    <span class="dymo-label">OUT LVL</span>
                    <span class="knob-value-display" id="knob-out-value">0.0 dB</span>
                </div>

                <div class="knob-group">
                    <div id="knob-mix" class="chicken-knob medium"></div>
                    <span class="dymo-label">MIX</span>
                    <span class="knob-value-display" id="knob-mix-value">100%</span>
                </div>
            </aside>

            <main class="screen-container">
                <div class="crt-bezel">
                    <div class="crt-glass-glare"></div>
                    <canvas id="main-screen" class="crt-screen"></canvas>
                </div>
            </main>
        </div>

        <footer class="panel bottom-panel">

            <div class="column-block">
                <div class="knob-group">
                    <div id="knob-amount" class="chicken-knob big"></div>
                    <span class="dymo-label">SIL AMOUNT</span>
                    <span class="knob-value-display" id="knob-amount-value">0%</span>
                </div>
            </div>

            <div class="vertical-divider"></div>

            <div class="section-block upward">
                <span class="section-block-title">UPWARD DYNAMICS</span>
                <div class="knobs-row">
                    <div class="knob-group">
                        <div id="knob-up-sel" class="chicken-knob medium"></div>
                        <span class="dymo-label">SELECT</span>
                        <span class="knob-value-display" id="knob-up-sel-value">50%</span>
                    </div>
                    <div class="knob-group">
                        <div id="knob-up-range" class="chicken-knob big"></div>
                        <span class="dymo-label">UP MAX</span>
                        <span class="knob-value-display" id="knob-up-range-value">0.0 dB</span>
                    </div>
                    <div class="knob-group">
                        <div id="knob-up-smooth" class="chicken-knob medium"></div>
                        <span class="dymo-label">SMOOTH</span>
                        <span class="knob-value-display" id="knob-up-smooth-value">50 ms</span>
                    </div>
                </div>
            </div>

            <div class="vertical-divider"></div>

            <div class="section-block downward">
                <span class="section-block-title">DOWNWARD DYNAMICS</span>
                <div class="knobs-row">
                    <div class="knob-group">
                        <div id="knob-down-sel" class="chicken-knob medium"></div>
                        <span class="dymo-label">SELECT</span>
                        <span class="knob-value-display" id="knob-down-sel-value">50%</span>
                    </div>
                    <div class="knob-group">
                        <div id="knob-down-range" class="chicken-knob big"></div>
                        <span class="dymo-label">DN MAX</span>
                        <span class="knob-value-display" id="knob-down-range-value">0.0 dB</span>
                    </div>
                    <div class="knob-group">
                        <div id="knob-down-smooth" class="chicken-knob medium"></div>
                        <span class="dymo-label">SMOOTH</span>
                        <span class="knob-value-display" id="knob-down-smooth-value">15 ms</span>
                    </div>
                </div>
            </div>

            <div class="vertical-divider"></div>

            <div class="section-block timing-section">
                <span class="section-block-title">SPECTRAL TIMING</span>

                <!-- Кнопка жёстко в углу -->
                <button id="btn-speed-auto" class="backlit-button amber active small timing-mode-button">A</button>

                <div class="timing-container">
                    <!-- AUTO -->
                    <div class="timing-view timing-view-auto active">
                        <div class="knob-group">
                            <div id="knob-speed" class="chicken-knob big"></div>
                            <span class="dymo-label">SPEED</span>
                            <span class="knob-value-display" id="knob-speed-value">AUTO</span>
                        </div>
                    </div>

                    <!-- MANUAL -->
                    <div class="timing-view timing-view-manual">
                        <div class="knobs-row">
                            <div class="knob-group">
                                <div id="knob-attack" class="chicken-knob medium"></div>
                                <span class="dymo-label">ATTACK</span>
                                <span class="knob-value-display" id="knob-attack-value">10 ms</span>
                            </div>
                            <div class="knob-group">
                                <div id="knob-release" class="chicken-knob medium"></div>
                                <span class="dymo-label">RELEASE</span>
                                <span class="knob-value-display" id="knob-release-value">100 ms</span>
                            </div>
                            <div class="knob-group">
                                <div id="knob-knee" class="chicken-knob medium"></div>
                                <span class="dymo-label">KNEE</span>
                                <span class="knob-value-display" id="knob-knee-value">6 dB</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </footer>
    </div>

    <script src="js/config/DebugConsole.js"></script>
    <script src="js/juce-bridge.js"></script>
    <script src="js/config/theme-config.js"></script>
    <script src="js/models/GradientManager.js"></script>
    <script src="js/components/ChickenKnob.js"></script>
    <script src="js/components/BacklitButton.js"></script>
    <script src="js/components/GradientFilterOverlay.js"></script>
    <script src="js/components/SpectrumScreen.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
